name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e "sdk-python[test]"
      - run: pytest -q
        working-directory: sdk-python

  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e "ingest[test]"
      - run: pytest -q
        working-directory: ingest

  sdk-js:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk-js } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: sdk-js/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test

  demo-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: demo/browser } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [python-sdk, ingest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e sdk-python
      - run: docker compose up --build -d
      - run: python scripts/e2e_smoke.py
      - if: failure()
        run: docker compose logs --tail=100
