services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: truti, POSTGRES_PASSWORD: truti, POSTGRES_DB: truti}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U truti"], interval: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20}
  ingest:
    build: ..
    environment: &env
      DATABASE_URL: postgresql://truti:truti@postgres:5432/truti
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      RATE_LIMIT_EPS: ${RATE_LIMIT_EPS:-200}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  worker:
    build: ..
    command: ["python", "-m", "truti_ingest.worker"]
    environment: *env
    ports: ["9100:9100"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
