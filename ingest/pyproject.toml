[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truti-ingest"
version = "0.1.0"
description = "Truti ingest service and worker"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "fakeredis>=2.23"]

[tool.setuptools.packages.find]
include = ["truti_ingest*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
