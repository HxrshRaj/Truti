[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truti"
version = "0.1.0"
description = "Truti error-tracking SDK for Python"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "fastapi", "httpx", "flask"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
