# Local stack: docker compose up --build
#   dashboard http://localhost:8080   ingest/API http://localhost:8000   admin token: dev-admin-token
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: truti, POSTGRES_PASSWORD: truti, POSTGRES_DB: truti }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U truti"], interval: 3s, retries: 20 }
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }

  ingest:
    build: ./ingest
    environment: &env
      DATABASE_URL: postgresql://truti:truti@postgres:5432/truti
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      RATE_LIMIT_EPS: ${RATE_LIMIT_EPS:-200}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-0}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./ingest
    command: python -m truti_ingest.worker
    environment: *env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ./web
    ports: ["8080:80"]
    depends_on: [ingest]

volumes:
  pgdata:
