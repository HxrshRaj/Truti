# Render Blueprint, sized for Render's free tier (no payment method should be needed; check their current pricing).
# Free-tier caveats: web services sleep after ~15 min idle (first request is slow; the SDKs retry), and the free
# Postgres expires after 30 days. NOT yet applied/verified by me.
databases:
  - name: truti-db
    plan: free

services:
  - type: keyvalue
    name: truti-redis
    plan: free
    ipAllowList: []

  - type: web
    name: truti-ingest
    runtime: docker
    plan: free
    dockerContext: ./ingest
    dockerfilePath: ./ingest/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: truti-db, property: connectionString } }
      - { key: REDIS_URL, fromService: { type: keyvalue, name: truti-redis, property: connectionString } }
      - { key: ADMIN_TOKEN, generateValue: true }
      - { key: CORS_ORIGINS, value: "*" }
      - { key: ALLOW_REGISTRATION, value: "0" }   # first account becomes admin; then registration closes
      - { key: RETENTION_DAYS, value: "30" }
      - { key: EMBED_WORKER, value: "1" }   # no free background-worker tier: the API process also consumes the stream
      - { key: WEB_CONCURRENCY, value: "1" }  # free instances have 512 MB

  - type: web
    name: truti-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - { type: rewrite, source: /*, destination: /index.html }

  - type: web
    name: truti-demo
    runtime: static
    rootDir: demo/browser
    buildCommand: npm install && npm run build
    staticPublishPath: dist
